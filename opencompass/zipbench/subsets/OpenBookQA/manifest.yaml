dataset_key: openbookqa
dataset_size: 500
dataset_fingerprint: 291a3281a7d8ab983e27b611cfecef32e74bb564bc0986b253fd52ed1f5e769f
selection_unit: row
breakdown_fields: []
dataset:
  type: zipbench.dataset.ZipSubsetDataset
  loader_kwargs:
    base_loader: opencompass.datasets.OBQADataset_Local
evaluator:
  type: zipbench.evaluator.WeightedAccuracyEvaluator
  merge_base_kwargs: false
  inject_subset_spec: false
weighting: 'weighted_acc = sum(w_i * correct_i) * 100   # weights are normalised so
  that sum(w_i) == 1'
subsets:
  small:
    file: small.jsonl
    n: 244
    ratio: 0.5112
    weight_sum: 1.0
  tiny:
    file: tiny.jsonl
    n: 170
    ratio: 0.6595
    weight_sum: 1.0
