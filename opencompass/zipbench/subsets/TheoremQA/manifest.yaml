dataset_key: TheoremQA
dataset_size: 800
dataset_fingerprint: c88e60adcf26ee8adcc163d6b46b2898d1461ada7e6f174f19cbd6bb299d08c3
selection_unit: row
breakdown_fields: []
dataset:
  type: zipbench.dataset.ZipSubsetDataset
  loader_kwargs:
    base_loader: opencompass.datasets.TheoremQADatasetV3
    id_field: id
evaluator:
  type: zipbench.adapters.theoremqa.WeightedTheoremQAEvaluator
  merge_base_kwargs: false
  inject_subset_spec: false
weighting: 'weighted_acc = sum(w_i * correct_i) * 100   # weights are normalised so
  that sum(w_i) == 1'
subsets:
  small:
    file: small.jsonl
    n: 400
    ratio: 0.4995
    weight_sum: 1.0
  tiny:
    file: tiny.jsonl
    n: 201
    ratio: 0.7492
    weight_sum: 1.0
