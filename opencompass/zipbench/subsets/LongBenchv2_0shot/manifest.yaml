dataset_key: LongBenchv2_0shot
dataset_size: 503
dataset_fingerprint: 8166926fbabc5e983ebb402de46a8ec8880b6379a7796a098d380eb3ee6472ce
selection_unit: row
breakdown_fields:
- difficulty
- length
dataset:
  type: zipbench.dataset.ZipSubsetDataset
  loader_kwargs:
    base_loader: opencompass.datasets.LongBenchv2Dataset
    id_field: _id
evaluator:
  type: zipbench.evaluator.WeightedAccuracyEvaluator
  merge_base_kwargs: false
  inject_subset_spec: false
weighting: 'weighted_acc = sum(w_i * correct_i) * 100   # weights are normalised so
  that sum(w_i) == 1'
subsets:
  tiny:
    file: tiny.jsonl
    n: 126
    ratio: 0.7495
    weight_sum: 1.0
  small:
    file: small.jsonl
    n: 220
    ratio: 0.5619
    weight_sum: 1.0
